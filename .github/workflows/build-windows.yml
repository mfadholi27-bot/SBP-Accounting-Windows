name: Build SBP Accounting V19 Windows
on:
  workflow_dispatch:
  push:
    branches: [v19-desktop-foundation]
    paths:
      - 'electron/**'
      - 'src/v19/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: npm
      - run: npm install
      - run: npm run dist:all
      - uses: actions/upload-artifact@v4
        with:
          name: SBP-Accounting-V19-Windows-Installers
          path: release/*.exe
          if-no-files-found: error
